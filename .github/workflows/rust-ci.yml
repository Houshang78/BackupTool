name: CI (Rust)

on:
  push:
    paths: ["rust/**", ".github/workflows/rust-ci.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust-ci.yml"]

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: test+clippy ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test (core + CLI)
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Release build (CLI)
        run: cargo build --release --bin backuptool

  gui-build:
    name: build Slint GUI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y
             libfontconfig1-dev libxcb1-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build GUI
        run: cargo build --features gui --bin backuptool-gui
